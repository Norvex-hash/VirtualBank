<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankGame KZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
        body{background-color:#e4e7eb;display:flex;justify-content:center;align-items:center;height:100vh;}
        .phone-container{width:100%;max-width:414px;height:100%;max-height:896px;background-color:#f8f9fa;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.15);}
        @media (min-width: 415px){.phone-container{height:844px;border-radius:40px;border:10px solid #2d3139;}}
        .screen{display:none;flex-direction:column;height:100%;width:100%;background:#ffffff;position:absolute;top:0;left:0;z-index:10;}
        .screen.active{display:flex;}
        .auth-container{padding:40px 24px;display:flex;flex-direction:column;justify-content:center;height:100%;background:linear-gradient(135deg, #00B140 0%, #007724 100%);color:white;}
        .auth-card{background:white;padding:30px 20px;border-radius:24px;color:#333;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
        .auth-card h2{margin-bottom:20px;font-size:22px;text-align:center;color:#00B140;}
        .input-group{margin-bottom:15px;}
        .input-group label{display:block;font-size:13px;color:#666;margin-bottom:5px;}
        .input-group input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:12px;font-size:15px;outline:none;}
        .btn{width:100%;padding:14px;background:#00B140;color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;}
        .switch-auth{text-align:center;margin-top:15px;font-size:13px;color:#666;cursor:pointer;}
        .switch-auth span{color:#00B140;font-weight:bold;}
        .app-main{display:flex;flex-direction:column;height:100%;background-color:#f8f9fa;}
        .bank-header{background:linear-gradient(135deg, #00B140 0%, #008731 100%);color:white;padding:25px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;}
        .account-title{font-size:13px;opacity:0.85;margin-bottom:5px;text-transform:uppercase;}
        .account-balance{font-size:32px;font-weight:700;}
        .tab-content{flex:1;overflow-y:auto;padding:20px;display:none;}
        .tab-content.active{display:block;}
        .card-widget{background:linear-gradient(135deg, #2c3e50, #34495e);color:white;padding:20px;border-radius:16px;margin-bottom:20px;}
        .card-widget .card-num{font-size:18px;letter-spacing:2px;margin:15px 0;font-family:monospace;}
        .card-widget .card-info{display:flex;justify-content:space-between;font-size:12px;opacity:0.8;}
        .actions-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;margin-bottom:20px;}
        .action-btn{background:white;border:none;padding:15px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
        .action-btn i{font-size:20px;color:#00B140;}
        .action-btn span{font-size:12px;color:#333;}
        .transfer-box{background:white;padding:20px;border-radius:16px;}
        .transfer-box h3{margin-bottom:15px;font-size:18px;color:#333;}
        .history-list{background:white;border-radius:16px;padding:15px;}
        .history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;}
        .history-item:last-child{border-bottom:none;}
        .history-info h4{font-size:14px;color:#333;}
        .history-info p{font-size:11px;color:#888;margin-top:2px;}
        .history-sum{font-weight:600;font-size:14px;color:#00B140;}
        .profile-card{background:white;border-radius:16px;padding:20px;text-align:center;margin-bottom:20px;}
        .profile-avatar{width:70px;height:70px;background:#e1f5e8;color:#00B140;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px auto;}
        .settings-list{background:white;border-radius:16px;overflow:hidden;}
        .setting-item{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;font-size:15px;color:#333;cursor:pointer;}
        .setting-item.danger{color:#e74c3c;}
        .bottom-nav{display:flex;justify-content:space-around;align-items:center;background-color:#ffffff;border-top:1px solid #eaeaea;padding:10px 0;}
        .nav-item{display:flex;flex-direction:column;align-items:center;color:#b0b0b0;cursor:pointer;background:none;border:none;flex:1;}
        .nav-item i{font-size:18px;margin-bottom:4px;}
        .nav-item span{font-size:11px;}
        .nav-item.active{color:#00B140;}
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- Авторизация -->
        <div id="authScreen" class="screen active">
            <div class="auth-container">
                <div style="text-align: center; margin-bottom: 25px;">
                    <h1 style="font-size: 28px; font-weight: 800;">VirtualBank KZ</h1>
                    <p style="font-size: 14px; opacity: 0.9; margin-top: 5px;">Ваш виртуальный игровой банк</p>
                </div>
                <div class="auth-card">
                    <h2 id="authTitle">Вход в аккаунт</h2>
                    <div class="input-group">
                        <label>Электронная почта (Email)</label>
                        <input type="email" id="emailInput" placeholder="example@mail.kz">
                    </div>
                    <div class="input-group">
                        <label>Пароль</label>
                        <input type="password" id="passInput" placeholder="••••••••">
                    </div>
                    <button class="btn" id="authBtn" onclick="handleAuth()">Войти</button>
                    <div class="switch-auth" id="switchAuthText" onclick="toggleAuthMode()">
                        Нет аккаунта? <span>Зарегистрироваться</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Приложение -->
        <div id="appScreen" class="screen">
            <div class="app-main">
                <div class="bank-header">
                    <div class="account-title">Текущий счёт (Виртуальные Тенге)</div>
                    <div class="account-balance" id="displayBalance">0 ₸</div>
                </div>

                <!-- Главная -->
                <div id="tab-home" class="tab-content active">
                    <div class="card-widget">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Virtual Black Card</span>
                            <i class="fa-brands fa-cc-mastercard" style="font-size: 24px;"></i>
                        </div>
                        <div class="card-num" id="displayCardNum">4400 •••• •••• 1234</div>
                        <div class="card-info">
                            <span>Баланс карты</span>
                            <span id="displayCardBalance">0 ₸</span>
                        </div>
                    </div>
                    <div class="actions-grid">
                        <button class="action-btn" onclick="switchTab('transfer')">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i><span>Переводы</span>
                        </button>
                        <button class="action-btn" onclick="alert('В этой игре пока нельзя заработать реальные деньги!')">
                            <i class="fa-solid fa-plus-circle"></i><span>Пополнить</span>
                        </button>
                        <button class="action-btn" onclick="switchTab('analytics')">
                            <i class="fa-solid fa-chart-pie"></i><span>История</span>
                        </button>
                    </div>
                </div>

                <!-- Переводы -->
                <div id="tab-transfer" class="tab-content">
                    <div class="transfer-box">
                        <h3>Перевод по номеру карты</h3>
                        <div class="input-group">
                            <label>Номер карты получателя</label>
                            <input type="text" id="recipientCard" placeholder="4400 0000 0000 0000" maxlength="19">
                        </div>
                        <div class="input-group">
                            <label>Сумма перевода (₸)</label>
                            <input type="number" id="transferAmount" placeholder="0">
                        </div>
                        <button class="btn" onclick="makeTransfer()">Отправить</button>
                    </div>
                </div>

                <!-- История -->
                <div id="tab-analytics" class="tab-content">
                    <h3 style="margin-bottom: 15px; font-size: 16px; color: #333;">История операций</h3>
                    <div class="history-list" id="historyListContainer"></div>
                </div>

                <!-- Профиль -->
                <div id="tab-profile" class="tab-content">
                    <div class="profile-card">
                        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                        <h3 id="profileEmailDisplay">user@mail.kz</h3>
                        <p>Статус: Игрок</p>
                    </div>
                </div>

                <!-- Настройки -->
                <div id="tab-settings" class="tab-content">
                    <div class="settings-list">
                        <div class="setting-item" onclick="alert('Версия: 1.0.0')"><span>О приложении</span><i class="fa-solid fa-chevron-right"></i></div>
                        <div class="setting-item danger" onclick="logout()"><span>Выйти из аккаунта</span><i class="fa-solid fa-right-from-bracket"></i></div>
                    </div>
                </div>

                <!-- Навигация -->
                <div class="bottom-nav">
                    <button class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><span>Главная</span></button>
                    <button class="nav-item" onclick="switchTab('transfer', this)"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Переводы</span></button>
                    <button class="nav-item" onclick="switchTab('analytics', this)"><i class="fa-solid fa-chart-pie"></i><span>История</span></button>
                    <button class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i><span>Профиль</span></button>
                    <button class="nav-item" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span>Настройки</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = JSON.parse(localStorage.getItem('bank_current_user')) || null;
        window.onload = function() { if (currentUser) openApp(); }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('authBtn');
            const switchText = document.getElementById('switchAuthText');
            if (isRegisterMode) {
                title.innerText = "Регистрация";
                btn.innerText = "Зарегистрироваться";
                switchText.innerHTML = "Есть аккаунт? <span>Войти</span>";
            } else {
                title.innerText = "Вход";
                btn.innerText = "Войти";
                switchText.innerHTML = "Нет аккаунта? <span>Зарегистрироваться</span>";
            }
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            if (!email || !pass) { alert('Заполните поля!'); return; }

            let users = JSON.parse(localStorage.getItem('bank_users')) || {};
            if (isRegisterMode) {
                if (users[email]) { alert('Email занят!'); return; }
                users[email] = {
                    password: pass,
                    balance: 1000,
                    cardNumber: "4400 1234 5678 " + Math.floor(1000 + Math.random() * 9000),
                    history: [{ title: "Бонус", desc: "За регистрацию", sum: "+1 000 ₸" }]
                };
                localStorage.setItem('bank_users', JSON.stringify(users));
                alert('Успешно!');
            } else {
                if (!users[email] || users[email].password !== pass) { alert('Неверные данные!'); return; }
            }
            currentUser = { email, ...users[email] };
            localStorage.setItem('bank_current_user', JSON.stringify(currentUser));
            openApp();
        }

        function openApp() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('appScreen').classList.add('active');
            updateUserDataUI();
        }

        function updateUserDataUI() {
            if (!currentUser) return;
            document.getElementById('displayBalance').innerText = currentUser.balance.toLocaleString() + " ₸";
            document.getElementById('displayCardBalance').innerText = currentUser.balance.toLocaleString() + " ₸";
            document.getElementById('displayCardNum').innerText = currentUser.cardNumber;
            document.getElementById('profileEmailDisplay').innerText = currentUser.email;

            const historyContainer = document.getElementById('historyListContainer');
            historyContainer.innerHTML = '';
            if (currentUser.history) {
                currentUser.history.forEach(item => {
                    historyContainer.innerHTML += `<div class="history-item"><div class="history-info"><h4>${item.title}</h4><p>${item.desc}</p></div><div class="history-sum">${item.sum}</div></div>`;
                });
            }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            if (element) {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                element.classList.add('active');
            }
        }

        function makeTransfer() {
            const card = document.getElementById('recipientCard').value.trim();
            const amount = parseInt(document.getElementById('transferAmount').value);
            if (!card || isNaN(amount) || amount <= 0) { alert('Проверьте данные!'); return; }
            if (amount > currentUser.balance) { alert('Недостаточно средств!'); return; }

            currentUser.balance -= amount;
            currentUser.history.unshift({ title: "Перевод", desc: "На карту " + card.slice(-4), sum: "-" + amount + " ₸" });
            saveUserData();
            updateUserDataUI();
            alert('Перевод выполнен!');
            switchTab('analytics');
        }

        function saveUserData() {
            let users = JSON.parse(localStorage.getItem('bank_users')) || {};
            users[currentUser.email] = { password: currentUser.password, balance: currentUser.balance, cardNumber: currentUser.cardNumber, history: currentUser.history };
            localStorage.setItem('bank_users', JSON.stringify(users));
            localStorage.setItem('bank_current_user', JSON.stringify(currentUser));
        }

        function logout() {
            localStorage.removeItem('bank_current_user');
            currentUser = null;
            document.getElementById('appScreen').classList.remove('active');
            document.getElementById('authScreen').classList.add('active');
        }
    </script>
</body>
</html>
